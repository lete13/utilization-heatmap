name: Sync from elysian-clearing

# Brings elysian-clearing main into this sandbox as a REVIEWABLE PULL REQUEST.
#
# This job never writes to main. Sandbox-only work committed here (for example
# the Daily Ops redesign and prototype) is therefore never overwritten. Upstream
# changes arrive on the sync/elysian-clearing branch and land only when the PR is
# merged, so any file touched on both sides surfaces as a normal merge conflict
# instead of being silently discarded.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [elysian-clearing-updated]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-from-elysian-clearing
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout utilization-heatmap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or update the upstream sync pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="sync/elysian-clearing"

          git remote add upstream https://github.com/lete13/elysian-clearing.git 2>/dev/null || true
          git fetch --quiet upstream main
          git fetch --quiet origin main

          UPSTREAM_SHA="$(git rev-parse upstream/main)"
          SHORT="${UPSTREAM_SHA:0:7}"

          # Already merged (or main is a descendant) means there is nothing to bring over.
          if git merge-base --is-ancestor "$UPSTREAM_SHA" origin/main; then
            echo "Upstream $SHORT is already contained in main — nothing to do."
            exit 0
          fi

          # The branch only ever tracks upstream/main, so force-updating it is safe.
          git push --force origin "$UPSTREAM_SHA:refs/heads/$BRANCH"
          echo "Pushed $BRANCH at $SHORT"

          EXISTING="$(gh pr list --base main --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING is already open; its branch now points at $SHORT."
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" \
            --title "Sync from elysian-clearing ($SHORT)" \
            --body "Brings [lete13/elysian-clearing](https://github.com/lete13/elysian-clearing) \`main\` (\`$SHORT\`) into this sandbox.

Opened automatically so upstream changes never overwrite sandbox-only work on \`main\`.

Merge when you want the upstream changes. If a file was changed both upstream and here (for example \`fe/daily-ops-beta.js\`), GitHub will report a conflict to resolve rather than discarding either side."
