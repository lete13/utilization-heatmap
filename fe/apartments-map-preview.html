<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<style>
body{margin:0;background:#f5f5f2;font-family:Inter,system-ui,-apple-system,sans-serif}
.banner{background:#0f1e2e;color:#fff;padding:9px 20px;font-size:12px}
.tab-panel{display:none} .tab-panel.active{display:block}
/* ── Apartments Map tab ────────────────────────────────────────────────────
   Lives here rather than in its own stylesheet so the release patch chain
   (which injects exactly one extra <link>) does not need to change. */
#tab-map { background: var(--ob-canvas, #f5f5f2); }
.amap-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 22px 40px; }
.amap-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  flex-wrap: wrap; gap: 12px; margin-bottom: 14px;
}
.amap-title { margin: 0; font-size: 20px; font-weight: 700; color: #16283a; letter-spacing: -.01em; }
.amap-sub { font-size: 12.5px; color: #626967; margin-top: 3px; max-width: 640px; }
.amap-controls { display: flex; align-items: center; gap: 8px; }
.amap-lbl { font-size: 11px; font-weight: 600; color: #888b87; text-transform: uppercase; letter-spacing: .04em; }
.amap-input {
  font: inherit; font-size: 13px; padding: 7px 10px; border-radius: 9px;
  border: 1px solid rgba(0,0,0,.12); background: #fff; color: #16283a; outline: none;
}
.amap-input:focus { border-color: #0f1e2e; }
.amap-btn {
  font: inherit; font-size: 12.5px; font-weight: 600; padding: 7px 14px; border-radius: 9px;
  border: 1px solid #0f1e2e; background: #0f1e2e; color: #fff; cursor: pointer;
}
.amap-btn:hover { background: #1b2f45; }

.amap-legend { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 12px; font-size: 12px; color: #626967; }
.amap-lg { display: inline-flex; align-items: center; gap: 6px; }
.amap-lg i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(0,0,0,.08); }
.amap-lg b { color: #16283a; font-weight: 700; }
.amap-lg-muted i { background: #b9bec4; }

.amap-canvas {
  height: 68vh; min-height: 420px; border-radius: 14px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(60,50,30,.05), 0 4px 18px rgba(60,50,30,.06);
  background: #e9e7e2;
}
.amap-error { padding: 28px; text-align: center; color: #9c362d; font-size: 13px; }
.amap-missing { margin-top: 10px; font-size: 11.5px; color: #888b87; line-height: 1.6; }
.amap-missing b { color: #16283a; }

/* tooltip: readable card rather than the default pale bubble */
.leaflet-tooltip.amap-tooltip {
  background: #ffffff; border: 1px solid rgba(0,0,0,.10); border-radius: 10px;
  box-shadow: 0 6px 20px rgba(22,40,58,.16); padding: 8px 11px; color: #16283a;
}
.leaflet-tooltip.amap-tooltip::before { border-top-color: #ffffff; }
.amap-tip-name { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
.amap-tip-status { font-size: 11.5px; font-weight: 700; }
.amap-tip-line { font-size: 11px; color: #626967; margin-top: 2px; }
.amap-tip-city { font-size: 10.5px; color: #888b87; margin-top: 3px; }
.amap-tip-cap { font-size: 11.5px; color: #16283a; margin-top: 3px; }
.amap-tip-cap b { font-weight: 700; }
.amap-tip-cap span { color: #888b87; font-weight: 400; }
.amap-tip-cap-none { color: #b9915a; font-style: italic; }

</style></head><body>
<div class="banner">PREVIEW — Apartments Map · hover a pin: status + max capacity · shown for 23/08/2026 12:00</div>
<div id="tab-ops" class="tab-panel"></div>

<script>
const BLOCK_NAMES=['blocked','block','owner stay','maintenance','ownerstay'];
function parseD(v){if(!v)return null;const s=String(v).trim();
 const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
 if(m)return new Date(m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'));
 const d=new Date(s);return isNaN(d)?null:d;}
function isRevenueBooking(b){return !BLOCK_NAMES.includes(String(b.guestName||'').toLowerCase().trim());}
// capacity cache, exactly like /api/rental-info returns
let _opsRentalInfo={
 a1:{houseRules:{maximum_guests:'4',base_capacity:'2'}},
 a2:{houseRules:{maximum_guests:'6',base_capacity:'4'}},
 a3:{houseRules:{maximum_guests:'2',base_capacity:'2'}},
 a4:{houseRules:{maximum_guests:'5',base_capacity:'3'}},
 a5:{houseRules:{maximum_guests:'8',base_capacity:'6'}},
 a6:{houseRules:{maximum_guests:'3',base_capacity:'3'}},
 a7:{houseRules:{base_capacity:'4'}},
 a9:{houseRules:{maximum_guests:'2',base_capacity:'2'}}
};
function _opsPrefetchRentalInfo(){}
const S={apts:[
 {id:'a1',name:'Vista Acropolis',lat:37.9715,lng:23.7267,city:'Athens'},
 {id:'a2',name:'The Athenian Cedar',lat:37.9838,lng:23.7275,city:'Athens'},
 {id:'a3',name:'Pixie Studio Athens',lat:38.0080,lng:23.7830,city:'Psichiko'},
 {id:'a4',name:'Birdhouse Apartment',lat:38.0030,lng:23.7950,city:'Cholargos'},
 {id:'a5',name:'Votsala 1 Luxury Stay',lat:37.9480,lng:23.6430,city:'Piraeus'},
 {id:'a6',name:'Le Plaza Thessaloniki',lat:40.6330,lng:22.9410,city:'Thessaloniki'},
 {id:'a7',name:'Le Grace Urban Retreat',lat:40.6210,lng:22.9530,city:'Thessaloniki'},
 {id:'a8',name:'Elysian Smyrni',lat:37.9450,lng:23.7150,city:'Nea Smyrni'},
 {id:'a9',name:'Athens Riviera Escape',lat:37.8880,lng:23.7480,city:'Argyroupoli'},
 {id:'a10',name:'No Coords Studio'}
],bks:[
 {aptId:'a2',guestName:'Maria K.',guests:5,checkIn:'20/08/2026',checkOut:'26/08/2026'},
 {aptId:'a4',guestName:'John Smith',guests:3,checkIn:'22/08/2026',checkOut:'25/08/2026'},
 {aptId:'a6',guestName:'Blocked',checkIn:'21/08/2026',checkOut:'28/08/2026'},
 {aptId:'a9',guestName:'Maintenance',checkIn:'23/08/2026',checkOut:'24/08/2026'},
 {aptId:'a7',guestName:'Anna P.',guests:4,checkIn:'23/08/2026',checkOut:'27/08/2026'}
]};
function showTab(n,b){}
</script>

<script>/* apartments-map.js — "Apartments Map" tab
 *
 * A Leaflet map of every property that has coordinates, with one pin each.
 * Pin colour answers a single question — is this place free right now?
 *
 *   green  = available          (no stay covers the chosen moment)
 *   blue   = reserved           (a guest booking covers it)
 *   red    = blocked            (an owner/maintenance block covers it)
 *
 * Hovering a pin shows the property, its status and the stay behind it, so
 * the map doubles as a proximity check: which free flat is nearest to X.
 *
 * Self-contained on purpose: it injects its own nav button and panel at
 * runtime and never edits index.html, so the release patch chain (which
 * verifies index.html by sha256) is left completely untouched.
 */
(function () {
  'use strict';

  var LEAFLET_CSS = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
  var LEAFLET_JS = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';

  var COLOR = { free: '#2e9e6b', booked: '#2f6fb5', blocked: '#c0483e' };
  var LABEL = { free: 'Available', booked: 'Reserved', blocked: 'Blocked' };

  var map = null;          // Leaflet map instance
  var layer = null;        // marker layer group
  var built = false;       // panel markup created
  var leafletLoading = false;

  // ── helpers ───────────────────────────────────────────────────────────────
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function byId(id) { return document.getElementById(id); }

  // The app's own date parser handles both D/M/YYYY and YYYY-MM-DD; fall back
  // to Date only if it is somehow unavailable.
  function pd(v) {
    if (typeof parseD === 'function') {
      var d = parseD(v);
      if (d && !isNaN(d)) return d;
      return null;
    }
    var f = new Date(v);
    return isNaN(f) ? null : f;
  }

  // A stay counts as a real reservation unless the app classes it as a block
  // (owner stay, maintenance, etc). Reuse the app's rule so the map can never
  // disagree with the rest of the system.
  function isBlockBooking(b) {
    if (typeof isRevenueBooking === 'function') return !isRevenueBooking(b);
    return false;
  }

  function apartments() {
    return (typeof S !== 'undefined' && Array.isArray(S.apts)) ? S.apts : [];
  }

  // Max capacity, read the same way Daily Ops reads it so the two can never
  // disagree: the Hosthub rental cache wins, then the manually set base
  // capacity stored on the apartment itself.
  function capacityOf(apt) {
    var rules = {};
    try {
      if (typeof _opsRentalInfo !== 'undefined' && _opsRentalInfo && apt && apt.id &&
          _opsRentalInfo[apt.id] && _opsRentalInfo[apt.id].houseRules) {
        rules = _opsRentalInfo[apt.id].houseRules;
      }
    } catch (e) { rules = {}; }

    var max = rules.maximum_guests;
    var base = (rules.base_capacity != null && rules.base_capacity !== '')
      ? rules.base_capacity
      : (apt && apt.baseCapacity);

    var maxN = parseInt(max, 10);
    var baseN = parseInt(base, 10);
    return {
      max: isFinite(maxN) && maxN > 0 ? maxN : null,
      base: isFinite(baseN) && baseN > 0 ? baseN : null
    };
  }

  // The capacity cache is fetched lazily by Daily Ops; ask for it if it has
  // not been loaded yet, and redraw once it lands.
  function ensureCapacityData() {
    try {
      if (typeof _opsRentalInfo !== 'undefined' && _opsRentalInfo) return;
      if (typeof _opsPrefetchRentalInfo === 'function') {
        _opsPrefetchRentalInfo();
        var tries = 0;
        var poll = setInterval(function () {
          var ready = (typeof _opsRentalInfo !== 'undefined' && _opsRentalInfo);
          if (ready || tries++ > 25) {
            clearInterval(poll);
            if (ready && map) draw();
          }
        }, 400);
      }
    } catch (e) { /* capacity is a nice-to-have; the map still works without it */ }
  }

  function bookings() {
    return (typeof S !== 'undefined' && Array.isArray(S.bks)) ? S.bks : [];
  }

  // Which stay, if any, covers `when` for this apartment?
  // Check-out day is treated as free: the guest leaves, the flat is available.
  function stayAt(apt, when) {
    var t = when.getTime();
    var list = bookings();
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (b.cancelled) continue;
      var sameApt = (b.aptId && apt.id && String(b.aptId) === String(apt.id)) ||
                    (b.aptName && apt.name && String(b.aptName) === String(apt.name));
      if (!sameApt) continue;
      var ci = pd(b.checkIn), co = pd(b.checkOut);
      if (!ci || !co) continue;
      if (t >= ci.getTime() && t < co.getTime()) return b;
    }
    return null;
  }

  function statusOf(apt, when) {
    var b = stayAt(apt, when);
    if (!b) return { key: 'free', booking: null };
    return { key: isBlockBooking(b) ? 'blocked' : 'booked', booking: b };
  }

  function fmt(d) {
    if (!d) return '—';
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear();
  }

  // ── asset loading ─────────────────────────────────────────────────────────
  function loadLeaflet(cb) {
    if (window.L && window.L.map) { cb(); return; }
    if (leafletLoading) { setTimeout(function () { loadLeaflet(cb); }, 120); return; }
    leafletLoading = true;

    if (!document.querySelector('link[data-amap-css]')) {
      var link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = LEAFLET_CSS;
      link.setAttribute('data-amap-css', '1');
      document.head.appendChild(link);
    }
    var s = document.createElement('script');
    s.src = LEAFLET_JS;
    s.onload = function () { leafletLoading = false; cb(); };
    s.onerror = function () {
      leafletLoading = false;
      var host = byId('amap-canvas');
      if (host) {
        host.innerHTML = '<div class="amap-error">The map library could not be loaded. ' +
          'Check the connection and reopen this tab.</div>';
      }
    };
    document.head.appendChild(s);
  }

  // ── panel markup ──────────────────────────────────────────────────────────
  function ensurePanel() {
    if (built && byId('tab-map')) return;

    // panel — dropped next to the other tab panels so showTab can find it
    var anchor = byId('tab-ops') || document.querySelector('.tab-panel');
    if (!anchor || !anchor.parentNode) return;

    var panel = byId('tab-map');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'tab-map';
      panel.className = 'tab-panel';
      anchor.parentNode.insertBefore(panel, anchor.nextSibling);
    }

    panel.innerHTML =
      '<div class="amap-wrap">' +
        '<div class="amap-head">' +
          '<div>' +
            '<h2 class="amap-title">Apartments Map</h2>' +
            '<div class="amap-sub">Every property with coordinates, coloured by whether it is free at the moment you pick.</div>' +
          '</div>' +
          '<div class="amap-controls">' +
            '<label class="amap-lbl" for="amap-when">Status at</label>' +
            '<input type="datetime-local" id="amap-when" class="amap-input">' +
            '<button type="button" id="amap-now" class="amap-btn">Now</button>' +
          '</div>' +
        '</div>' +
        '<div class="amap-legend">' +
          '<span class="amap-lg"><i style="background:' + COLOR.free + '"></i>Available <b id="amap-n-free">0</b></span>' +
          '<span class="amap-lg"><i style="background:' + COLOR.booked + '"></i>Reserved <b id="amap-n-booked">0</b></span>' +
          '<span class="amap-lg"><i style="background:' + COLOR.blocked + '"></i>Blocked <b id="amap-n-blocked">0</b></span>' +
          '<span class="amap-lg amap-lg-muted" id="amap-missing-wrap">No coordinates <b id="amap-n-missing">0</b></span>' +
        '</div>' +
        '<div id="amap-canvas" class="amap-canvas"></div>' +
        '<div id="amap-missing" class="amap-missing"></div>' +
      '</div>';

    // default to right now, rounded to the minute
    var when = byId('amap-when');
    if (when && !when.value) when.value = localNowValue();

    if (when) when.addEventListener('change', draw);
    var now = byId('amap-now');
    if (now) now.addEventListener('click', function () {
      var el = byId('amap-when');
      if (el) { el.value = localNowValue(); draw(); }
    });

    built = true;
  }

  function localNowValue() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      'T' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function chosenMoment() {
    var el = byId('amap-when');
    if (el && el.value) {
      var d = new Date(el.value);
      if (!isNaN(d)) return d;
    }
    return new Date();
  }

  // ── nav button ────────────────────────────────────────────────────────────
  function ensureNavButton() {
    if (byId('nav-map')) return;
    // sit next to Keys Hubs, which is the other location-flavoured tab
    var sibling = byId('nav-keys') || byId('nav-pinfo') || byId('nav-perf');
    if (!sibling || !sibling.parentNode) return;

    var btn = document.createElement('button');
    btn.className = 'nav-btn';
    btn.id = 'nav-map';
    btn.setAttribute('data-tab', 'map');
    btn.textContent = 'Apartments Map';
    btn.addEventListener('click', function () { showTab('map', btn); });
    sibling.parentNode.insertBefore(btn, sibling.nextSibling);
  }

  // ── drawing ───────────────────────────────────────────────────────────────
  function draw() {
    if (!window.L || !byId('amap-canvas')) return;
    var when = chosenMoment();

    if (!map) {
      map = L.map('amap-canvas', { scrollWheelZoom: true });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);
      map.setView([38.2, 23.8], 6); // Greece, until we know the real bounds
    }
    if (layer) { layer.clearLayers(); } else { layer = L.layerGroup().addTo(map); }

    var counts = { free: 0, booked: 0, blocked: 0 };
    var missing = [];
    var points = [];

    apartments().forEach(function (apt) {
      var la = parseFloat(apt.lat), ln = parseFloat(apt.lng);
      if (!isFinite(la) || !isFinite(ln)) { missing.push(apt.name || apt.id || '—'); return; }

      var st = statusOf(apt, when);
      counts[st.key]++;
      points.push([la, ln]);

      var marker = L.circleMarker([la, ln], {
        radius: 8,
        color: '#ffffff',
        weight: 2,
        fillColor: COLOR[st.key],
        fillOpacity: 0.95
      });

      var b = st.booking;
      var detail = '';
      if (b) {
        var ci = pd(b.checkIn), co = pd(b.checkOut);
        detail = '<div class="amap-tip-line">' + fmt(ci) + ' → ' + fmt(co) + '</div>';
        if (st.key === 'booked' && b.guestName) {
          detail += '<div class="amap-tip-line">' + esc(b.guestName) + '</div>';
        }
      }

      // Max capacity — the question that usually follows "is it free?"
      var cap = capacityOf(apt);
      var capLine = '';
      if (cap.max) {
        capLine = '<div class="amap-tip-cap">Sleeps up to <b>' + cap.max + '</b>' +
          (cap.base && cap.base !== cap.max ? ' <span>(' + cap.base + ' beds + sofa)</span>' : '') +
          '</div>';
      } else if (cap.base) {
        capLine = '<div class="amap-tip-cap">Base capacity <b>' + cap.base + '</b></div>';
      } else {
        capLine = '<div class="amap-tip-cap amap-tip-cap-none">Capacity not set</div>';
      }

      // When occupied, show how full it actually is against that capacity
      var guestsLine = '';
      if (b && st.key === 'booked') {
        var g = parseInt(b.guests, 10);
        if (isFinite(g) && g > 0) {
          guestsLine = '<div class="amap-tip-line">' + g + ' guest' + (g === 1 ? '' : 's') +
            (cap.max ? ' of ' + cap.max : '') + '</div>';
        }
      }

      marker.bindTooltip(
        '<div class="amap-tip">' +
          '<div class="amap-tip-name">' + esc(apt.name || apt.id || '—') + '</div>' +
          '<div class="amap-tip-status" style="color:' + COLOR[st.key] + '">' + LABEL[st.key] + '</div>' +
          capLine +
          guestsLine +
          detail +
          (apt.city ? '<div class="amap-tip-city">' + esc(apt.city) + '</div>' : '') +
        '</div>',
        { direction: 'top', opacity: 1, className: 'amap-tooltip' }
      );
      marker.addTo(layer);
    });

    var setTxt = function (id, v) { var el = byId(id); if (el) el.textContent = v; };
    setTxt('amap-n-free', counts.free);
    setTxt('amap-n-booked', counts.booked);
    setTxt('amap-n-blocked', counts.blocked);
    setTxt('amap-n-missing', missing.length);

    var mw = byId('amap-missing-wrap');
    if (mw) mw.style.display = missing.length ? '' : 'none';

    var mbox = byId('amap-missing');
    if (mbox) {
      mbox.innerHTML = missing.length
        ? '<b>Not on the map</b> — no coordinates on record for: ' +
          missing.map(esc).join(' · ') +
          '. Run a Hosthub sync to fill these in.'
        : '';
    }

    if (points.length) {
      map.fitBounds(L.latLngBounds(points).pad(0.15));
      if (points.length === 1) map.setZoom(14);
    }
  }

  // Leaflet needs a size recalculation when its container becomes visible.
  function activate() {
    ensurePanel();
    ensureCapacityData();
    loadLeaflet(function () {
      draw();
      setTimeout(function () { if (map) map.invalidateSize(); }, 60);
    });
  }

  // ── wire into the app ─────────────────────────────────────────────────────
  function hookShowTab() {
    var original = window.showTab;
    if (typeof original !== 'function' || original.__amapWrapped) return;

    var wrapped = function (name, btn) {
      if (name === 'map') {
        ensurePanel();
        // mirror the app's own tab switching, then render
        document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
        document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
        var panel = byId('tab-map');
        if (panel) panel.classList.add('active');
        if (btn && btn.classList) btn.classList.add('active');
        requestAnimationFrame(activate);
        return;
      }
      return original.apply(this, arguments);
    };
    wrapped.__amapWrapped = true;
    window.showTab = wrapped;
  }

  function init() {
    try {
      ensureNavButton();
      hookShowTab();
    } catch (e) {
      if (window.console && console.warn) console.warn('[apartments-map] init failed:', e);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  // the app builds its shell asynchronously after login, so retry briefly
  var tries = 0;
  var t = setInterval(function () {
    if (byId('nav-map') || tries++ > 40) { clearInterval(t); return; }
    init();
  }, 400);

  window.renderApartmentsMap = activate;
})();
</script>
<script>
window.addEventListener('load',function(){
  window.renderApartmentsMap();
  var p=document.getElementById('tab-map'); if(p) p.classList.add('active');
  var w=document.getElementById('amap-when'); if(w) w.value='2026-08-23T12:00';
  window.renderApartmentsMap();
});
</script></body></html>
